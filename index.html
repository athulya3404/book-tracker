<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Book Tracker</h1>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Add a Book</h2>

          <form id="book-form" novalidate>
            <div class="field">
              <label for="title">Title</label>
              <input id="title" name="title" type="text" />
              <span class="error-message" id="title-error"></span>
            </div>

            <div class="field">
              <label for="author">Author</label>
              <input id="author" name="author" type="text" />
              <span class="error-message" id="author-error"></span>
            </div>

            <div class="field">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="To read">To read</option>
                <option value="Reading">Reading</option>
                <option value="Finished">Finished</option>
              </select>
            </div>

            <button type="submit" class="primary-btn">Add</button>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="toolbar">
            <h2>My Books</h2>
            <input
              id="search"
              type="search"
              placeholder="Search by title or author"
              aria-label="Search books"
            />
          </div>

          <div class="status-summary" aria-label="Book counts by status">
            <div class="status-pill">
              <span>To read</span>
              <strong id="to-read-count">0</strong>
            </div>
            <div class="status-pill">
              <span>Reading</span>
              <strong id="reading-count">0</strong>
            </div>
            <div class="status-pill">
              <span>Finished</span>
              <strong id="finished-count">0</strong>
            </div>
          </div>

          <ul id="book-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
